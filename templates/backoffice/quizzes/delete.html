{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} | SkillForge</title><link rel="stylesheet" href="{% static 'backoffice/dashboard.css' %}"></head><body class="dashboard-body"><div class="dashboard-shell"><aside class="dashboard-sidebar"><a class="dashboard-logo" href="{% url 'home' %}"><span class="logo-shape">S</span><span>SkillForge</span></a><p class="sidebar-label">QUIZ MANAGEMENT</p><nav class="dashboard-nav"><a href="{% url 'users:quiz_manage_list' %}">Quiz management</a></nav></aside><main class="dashboard-main"><header class="dashboard-header"><div><p class="eyebrow">CONFIRMATION</p><h1>Delete quiz</h1></div></header><section class="panel"><p>Are you sure you want to delete <strong>{{ quiz.title }}</strong> and its {{ quiz.questions|length }} question(s)?</p><form method="post">{% csrf_token %}<button class="primary-button" type="submit">Confirm deletion</button> <a class="outline-button" href="{% url 'users:quiz_manage_detail' quiz_id=quiz.id %}">Cancel</a></form></section></main></div></body></html>
