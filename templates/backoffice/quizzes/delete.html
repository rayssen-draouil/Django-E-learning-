{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} | SkillForge</title><link rel="stylesheet" href="{% static 'backoffice/dashboard.css' %}"></head><body class="dashboard-body"><div class="dashboard-shell"><aside class="dashboard-sidebar"><a class="dashboard-logo" href="{% url 'home' %}"><span class="logo-shape">S</span><span>SkillForge</span></a><p class="sidebar-label">GESTION DES QUIZ</p><nav class="dashboard-nav"><a href="{% url 'users:quiz_manage_list' %}">Mes quiz</a></nav></aside><main class="dashboard-main"><header class="dashboard-header"><div><p class="eyebrow">CONFIRMATION</p><h1>Supprimer le quiz</h1></div></header><section class="panel"><p>Confirmez-vous la suppression de <strong>{{ quiz.title }}</strong> et de ses {{ quiz.questions|length }} question(s) ?</p><form method="post">{% csrf_token %}<button class="primary-button" type="submit">Confirmer la suppression</button> <a class="outline-button" href="{% url 'users:quiz_manage_detail' quiz_id=quiz.id %}">Annuler</a></form></section></main></div></body></html>
