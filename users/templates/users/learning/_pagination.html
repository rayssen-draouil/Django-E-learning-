{% if is_paginated %}
<nav class="pagination" aria-label="Pagination des résultats">
    {% if page_obj.has_previous %}
        <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Précédent</a>
    {% endif %}
    <span class="page-status">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Suivant →</a>
    {% endif %}
</nav>
{% endif %}
