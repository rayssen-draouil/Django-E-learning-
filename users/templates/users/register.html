{% extends "base.html" %}
{% block title %}Inscription | E-Learning{% endblock %}
{% block content %}
<section class="card">
    <h1>Créer un compte</h1>
    <form method="post" novalidate>
        {% csrf_token %}{{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <button type="submit">S'inscrire</button>
    </form>
    <p>Déjà inscrit ? <a href="{% url 'users:login' %}">Se connecter</a></p>
</section>
{% endblock %}
